<ion-input
  mode="md"
  fill="outline"
  label-placement="floating"
  [label]="label"
  [value]="value"
  [type]="type"
  [placeholder]="placeholder"
  [helperText]="helperText"
  [errorText]="errorText"
  [autocomplete]="autocomplete"
  [disabled]="disabled"
  (ionInput)="valueChange.emit($event.detail.value ?? '')"
/>
