<ion-modal
  [isOpen]="open"
  [initialBreakpoint]="0.5"
  [breakpoints]="[0, 0.5, 0.9]"
  [backdropDismiss]="true"
  (didDismiss)="close()"
>
  <ng-template>
    <ion-header class="ion-no-border">
      <ion-toolbar>
        <ion-title>{{ title }}</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="close()">Close</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <div class="sheet-content">
        <ng-content />
      </div>
    </ion-content>
  </ng-template>
</ion-modal>
