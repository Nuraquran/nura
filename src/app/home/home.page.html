<ion-content [fullscreen]="true" class="nura-content">
  <!-- Background -->
  <div class="bg-layer"></div>
  <div class="stars-layer"></div>
  <div class="mosque-silhouette"></div>

  <!-- Header -->
  <div class="nura-header">
    <button class="icon-btn" (click)="openMenu()">
      <ion-icon name="menu-outline"></ion-icon>
    </button>
    <button class="icon-btn" (click)="toggleDarkMode()">
      <ion-icon name="moon-outline"></ion-icon>
    </button>
  </div>

  <!-- Logo Section -->
  <div class="logo-section">
    <div class="arch-container">
      <div class="arch-glow"></div>
      <svg
        class="arch-svg"
        viewBox="0 0 200 220"
        xmlns="http://www.w3.org/2000/svg"
      >
        <!-- Outer arch -->
        <path
          d="M100 10 L160 60 L170 130 L150 190 L100 210 L50 190 L30 130 L40 60 Z"
          fill="none"
          stroke="url(#goldGrad)"
          stroke-width="1.5"
          opacity="0.6"
        />
        <!-- Inner arch -->
        <path
          d="M100 25 L148 65 L156 125 L138 178 L100 195 L62 178 L44 125 L52 65 Z"
          fill="none"
          stroke="url(#goldGrad)"
          stroke-width="0.8"
          opacity="0.4"
        />
        <!-- Top diamond -->
        <polygon points="100,2 106,10 100,18 94,10" fill="url(#goldGrad)" />
        <!-- Open book base -->
        <path
          d="M55 185 Q100 175 145 185 L148 200 Q100 192 52 200 Z"
          fill="url(#goldGrad)"
          opacity="0.8"
        />
        <path
          d="M55 185 Q100 175 145 185"
          fill="none"
          stroke="url(#goldGrad)"
          stroke-width="1"
        />
        <!-- Arabic calligraphy glow circle -->
        <circle cx="100" cy="110" r="28" fill="url(#glowGrad)" opacity="0.9" />
        <!-- Decorative dots -->
        <circle cx="100" cy="28" r="1.5" fill="#d4af37" />
        <circle cx="100" cy="195" r="1.5" fill="#d4af37" />
        <defs>
          <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color: #f0d060" />
            <stop offset="50%" style="stop-color: #d4af37" />
            <stop offset="100%" style="stop-color: #a07820" />
          </linearGradient>
          <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color: #ffe08a; stop-opacity: 1" />
            <stop offset="60%" style="stop-color: #d4af37; stop-opacity: 0.8" />
            <stop
              offset="100%"
              style="stop-color: #a07820; stop-opacity: 0.3"
            />
          </radialGradient>
        </defs>
      </svg>
      <!-- Arabic text inside glow -->
      <div class="arabic-calligraphy">نور</div>
    </div>

    <h1 class="app-title">NÛR<span class="title-a">Ā</span></h1>
    <p class="app-tagline">CAHAYA DI SETIAP AYAT</p>
    <div class="title-diamond">◆</div>
  </div>

  <!-- Menu Cards -->
  <div class="menu-list">
    <div
      class="menu-card"
      (click)="navigate('quran')"
      [style.animation-delay]="'0.1s'"
    >
      <div class="menu-icon-wrap">
        <div class="icon-ring">
          <ion-icon name="book-outline"></ion-icon>
        </div>
      </div>
      <div class="menu-text">
        <span class="menu-title">BACA AL-QUR'AN</span>
        <span class="menu-sub">Membaca dengan tenang</span>
      </div>
      <ion-icon name="arrow-forward-outline" class="arrow-icon"></ion-icon>
    </div>

    <div
      class="menu-card"
      (click)="navigate('last-read')"
      [style.animation-delay]="'0.2s'"
    >
      <div class="menu-icon-wrap">
        <div class="icon-ring">
          <ion-icon name="bookmark-outline"></ion-icon>
        </div>
      </div>
      <div class="menu-text">
        <span class="menu-title">TERAKHIR BACA</span>
        <span class="menu-sub">Lanjutkan bacaan Anda</span>
      </div>
      <ion-icon name="arrow-forward-outline" class="arrow-icon"></ion-icon>
    </div>

    <div
      class="menu-card"
      (click)="navigate('search')"
      [style.animation-delay]="'0.3s'"
    >
      <div class="menu-icon-wrap">
        <div class="icon-ring">
          <ion-icon name="search-outline"></ion-icon>
        </div>
      </div>
      <div class="menu-text">
        <span class="menu-title">PENCARIAN AYAT</span>
        <span class="menu-sub">Temukan ayat yang Anda cari</span>
      </div>
      <ion-icon name="arrow-forward-outline" class="arrow-icon"></ion-icon>
    </div>

    <div
      class="menu-card"
      (click)="navigate('prayer')"
      [style.animation-delay]="'0.4s'"
    >
      <div class="menu-icon-wrap">
        <div class="icon-ring">
          <ion-icon name="home-outline"></ion-icon>
        </div>
      </div>
      <div class="menu-text">
        <span class="menu-title">JADUAL SOLAT</span>
        <span class="menu-sub">Waktu solat untuk lokasi Anda</span>
      </div>
      <ion-icon name="arrow-forward-outline" class="arrow-icon"></ion-icon>
    </div>

    <div
      class="menu-card"
      (click)="navigate('settings')"
      [style.animation-delay]="'0.5s'"
    >
      <div class="menu-icon-wrap">
        <div class="icon-ring">
          <ion-icon name="settings-outline"></ion-icon>
        </div>
      </div>
      <div class="menu-text">
        <span class="menu-title">PENGATURAN</span>
        <span class="menu-sub">Sesuaikan pengalaman Anda</span>
      </div>
      <ion-icon name="arrow-forward-outline" class="arrow-icon"></ion-icon>
    </div>
  </div>

  <!-- Bottom padding -->
  <div style="height: 80px"></div>
</ion-content>
