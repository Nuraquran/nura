<ion-content [fullscreen]="true" class="nura-content">
  <div class="bg-layer"></div>
  <div class="stars-layer"></div>

  <!-- Header -->
  <div class="nura-header">
    <button class="icon-btn" (click)="goBack()">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>
    <h2 class="page-title">Al-Qur'an</h2>
    <div class="header-actions">
      <button class="icon-btn" (click)="goToBookmark()">
        <ion-icon name="bookmark-outline"></ion-icon>
      </button>
      <button class="icon-btn" (click)="toggleSearch()">
        <ion-icon name="search-outline"></ion-icon>
      </button>
    </div>
  </div>

  <!-- Search Bar -->
  <div class="search-bar-wrap" [class.visible]="searchVisible">
    <div class="search-bar">
      <ion-icon name="search-outline" class="search-icon"></ion-icon>
      <input
        #searchInput
        type="text"
        placeholder="Carian surah"
        [(ngModel)]="searchQuery"
        (input)="onSearch()"
        class="search-input"
      />
      <button class="clear-btn" *ngIf="searchQuery" (click)="clearSearch()">
        <ion-icon name="close-outline"></ion-icon>
      </button>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <button
      class="tab-btn"
      [class.active]="activeTab === 'read'"
      (click)="setTab('read')"
    >
      Read
    </button>
    <button
      class="tab-btn"
      [class.active]="activeTab === 'learn'"
      (click)="setTab('learn')"
    >
      Learn
    </button>
    <button
      class="tab-btn"
      [class.active]="activeTab === 'progress'"
      (click)="setTab('progress')"
    >
      My Progress
    </button>
  </div>
  <div class="gold-divider"></div>

  <!-- ── Loading skeleton ─────────────────────────────────────────────────── -->
  <div class="surah-list" *ngIf="isLoading">
    <div class="skeleton-card" *ngFor="let i of [1,2,3,4,5,6,7,8]">
      <div class="sk sk-num"></div>
      <div class="sk sk-arabic"></div>
      <div class="sk-info">
        <div class="sk sk-name"></div>
        <div class="sk sk-meaning"></div>
      </div>
      <div class="sk sk-ayat"></div>
    </div>
  </div>

  <!-- ── Error state ──────────────────────────────────────────────────────── -->
  <div class="error-state" *ngIf="!isLoading && errorMsg">
    <ion-icon name="refresh-outline" class="error-icon"></ion-icon>
    <p class="error-text">{{ errorMsg }}</p>
    <button class="retry-btn" (click)="loadSurahs()">Cuba Semula</button>
  </div>

  <!-- ── Surah list ───────────────────────────────────────────────────────── -->
  <div class="surah-list" *ngIf="!isLoading && !errorMsg">
    <app-surah-card
      *ngFor="let surah of filteredSurahs; let i = index"
      [surah]="surah"
      [style.animation-delay]="(i * 0.03) + 's'"
      class="surah-card-anim"
      (cardClick)="openSurah($event)"
    ></app-surah-card>

    <!-- Empty search result -->
    <div class="empty-state" *ngIf="filteredSurahs.length === 0 && searchQuery">
      <ion-icon name="search-outline"></ion-icon>
      <p>Tiada surah dijumpai untuk "<strong>{{ searchQuery }}</strong>"</p>
    </div>
  </div>

  <div style="height: 40px"></div>
</ion-content>
