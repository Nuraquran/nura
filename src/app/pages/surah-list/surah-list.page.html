<ion-content [fullscreen]="true" class="nura-content">
  <!-- Background layers -->
  <div class="bg-layer"></div>
  <div class="stars-layer"></div>

  <!-- Header -->
  <div class="nura-header">
    <button class="icon-btn" (click)="goBack()">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>
    <h2 class="page-title">Al-Qur'an</h2>
    <div class="header-actions">
      <button class="icon-btn" (click)="goToBookmark()">
        <ion-icon name="bookmark-outline"></ion-icon>
      </button>
      <button class="icon-btn" (click)="toggleSearch()">
        <ion-icon name="search-outline"></ion-icon>
      </button>
    </div>
  </div>

  <!-- Search Bar -->
  <div class="search-bar-wrap" [class.visible]="searchVisible">
    <div class="search-bar">
      <ion-icon name="search-outline" class="search-icon"></ion-icon>
      <input
        #searchInput
        type="text"
        placeholder="Cari surah..."
        [(ngModel)]="searchQuery"
        (input)="onSearch()"
        class="search-input"
      />
      <button class="clear-btn" *ngIf="searchQuery" (click)="clearSearch()">
        <ion-icon name="close-outline"></ion-icon>
      </button>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <button
      class="tab-btn"
      [class.active]="activeTab === 'read'"
      (click)="setTab('read')"
    >
      Read
    </button>
    <button
      class="tab-btn"
      [class.active]="activeTab === 'learn'"
      (click)="setTab('learn')"
    >
      Learn
    </button>
    <button
      class="tab-btn"
      [class.active]="activeTab === 'progress'"
      (click)="setTab('progress')"
    >
      My Progress
    </button>
  </div>
  <div class="gold-divider"></div>

  <!-- ✅ Surah List — guna reusable SurahCardComponent -->
  <div class="surah-list">
    <app-surah-card
      *ngFor="let surah of filteredSurahs; let i = index"
      [surah]="surah"
      [style.animation-delay]="(i * 0.04) + 's'"
      class="surah-card-anim"
      (cardClick)="openSurah($event)"
    ></app-surah-card>

    <!-- Empty state -->
    <div class="empty-state" *ngIf="filteredSurahs.length === 0">
      <ion-icon name="search-outline"></ion-icon>
      <p>Tiada surah dijumpai</p>
    </div>
  </div>

  <div style="height: 40px"></div>
</ion-content>
