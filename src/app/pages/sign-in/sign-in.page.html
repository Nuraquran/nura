<ion-content [fullscreen]="true" class="nura-content">
  <div class="page-wrapper">
    <div class="bg-glow"></div>

    <div class="nura-header">
      <button class="icon-btn" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
    </div>

    <div class="logo-section">
      <img
        src="assets/images/nura-logo-transparent.png"
        alt="Nura"
        class="logo-img"
      />
    </div>

    <div class="title-section">
      <h1 class="page-title">Welcome Back</h1>
      <p class="page-sub">Sign in to continue your journey</p>
      <div class="title-divider">
        <span class="divider-line"></span>
        <span class="divider-diamond">◆</span>
        <span class="divider-line"></span>
      </div>
    </div>

    <form class="form-section" [formGroup]="form" (ngSubmit)="signIn()">
      <!-- Email -->
      <div
        class="input-group"
        [class.focused]="email.dirty || email.touched"
        [class.has-value]="email.value"
        [class.invalid]="email.invalid && email.touched"
      >
        <div class="input-icon">
          <ion-icon name="mail-outline"></ion-icon>
        </div>
        <div class="input-wrap">
          <label class="input-label">Email</label>
          <input
            type="email"
            class="nura-input"
            formControlName="email"
            autocomplete="email"
            inputmode="email"
            placeholder="your@email.com"
          />
        </div>
      </div>

      <!-- Password -->
      <div
        class="input-group"
        [class.focused]="password.dirty || password.touched"
        [class.has-value]="password.value"
        [class.invalid]="password.invalid && password.touched"
      >
        <div class="input-icon">
          <ion-icon name="lock-closed-outline"></ion-icon>
        </div>
        <div class="input-wrap">
          <label class="input-label">Password</label>
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="nura-input"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
          />
        </div>
        <button type="button" class="eye-btn" (click)="togglePassword()">
          <ion-icon
            [name]="showPassword ? 'eye-outline' : 'eye-off-outline'"
          ></ion-icon>
        </button>
      </div>

      <!-- Forgot password -->
      <div class="forgot-wrap">
        <button type="button" class="forgot-btn" (click)="forgotPassword()">
          Forgot password?
        </button>
      </div>

      <!-- Sign In -->
      <button type="submit" class="btn-primary" [class.loading]="isLoading">
        <ng-container *ngIf="!isLoading">
          <span>SIGN IN</span>
          <ion-icon name="chevron-forward-outline" class="btn-arrow"></ion-icon>
        </ng-container>
        <div class="spinner" *ngIf="isLoading">
          <div class="spin-dot"></div>
          <div class="spin-dot"></div>
          <div class="spin-dot"></div>
        </div>
      </button>

      <!-- OR -->
      <div class="or-divider">
        <span class="or-line"></span>
        <span class="or-text">or continue with</span>
        <span class="or-line"></span>
      </div>

      <!-- Social -->
      <div class="social-row">
        <button type="button" class="btn-social" (click)="loginApple()">
          <ion-icon name="logo-apple" class="social-icon"></ion-icon>
          <span>Apple</span>
        </button>
        <button type="button" class="btn-social" (click)="loginGoogle()">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"
            />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
              fill="#FBBC05"
            />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335"
            />
          </svg>
          <span>Google</span>
        </button>
      </div>
    </form>

    <div class="footer-section">
      <p class="footer-text">
        Don't have an account?
        <button class="link-btn" (click)="goToRegister()">Create one</button>
      </p>
    </div>
  </div>
</ion-content>
