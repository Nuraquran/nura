<ion-content [fullscreen]="true" class="nura-content">
  <!-- ── Hero Section: logo image sebagai full background ────────────────── -->
  <div class="hero-section">
    <!-- Logo image jadi background hero -->
    <div class="hero-bg"></div>

    <!-- Dark fade gradient bawah supaya blend ke content -->
    <div class="hero-fade"></div>

    <!-- Language selector (atas kanan) -->
    <div class="lang-wrap">
      <button class="lang-btn" (click)="toggleLang()">
        <ion-icon name="globe-outline"></ion-icon>
        <span>{{ selectedLang }}</span>
        <ion-icon name="chevron-down-outline"></ion-icon>
      </button>
    </div>
  </div>
  <!-- ── End Hero ──────────────────────────────────────────────────────────── -->

  <!-- ── Tagline ─────────────────────────────────────────────────────────── -->
  <div class="tagline-section">
    <p class="tagline-main">The Qur'an.<br />Closer to your heart.</p>
    <div class="tagline-divider">
      <span class="divider-line"></span>
      <span class="divider-diamond">◆</span>
      <span class="divider-line"></span>
    </div>
    <p class="tagline-sub">READ. REFLECT. GROW.</p>
  </div>

  <!-- ── Auth Buttons ────────────────────────────────────────────────────── -->
  <div class="auth-section">
    <!-- Create Account -->
    <button class="btn-primary" (click)="createAccount()">
      <div class="btn-icon-wrap">
        <ion-icon name="sunny-outline"></ion-icon>
      </div>
      <span>CREATE AN ACCOUNT</span>
      <ion-icon name="chevron-forward-outline" class="btn-arrow"></ion-icon>
    </button>

    <!-- Sign In -->
    <button class="btn-secondary" (click)="signIn()">
      <div class="btn-icon-wrap secondary">
        <ion-icon name="lock-closed-outline"></ion-icon>
      </div>
      <span>SIGN IN</span>
      <ion-icon name="chevron-forward-outline" class="btn-arrow"></ion-icon>
    </button>

    <!-- OR divider -->
    <div class="or-divider">
      <span class="or-line"></span>
      <span class="or-text">OR CONTINUE WITH</span>
      <span class="or-line"></span>
    </div>

    <!-- Social -->
    <div class="social-row">
      <button class="btn-social" (click)="loginGoogle()">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            fill="#4285F4"
          />
          <path
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            fill="#34A853"
          />
          <path
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
            fill="#FBBC05"
          />
          <path
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            fill="#EA4335"
          />
        </svg>
        <span>GOOGLE</span>
      </button>

      <button class="btn-social" (click)="loginApple()">
        <svg
          width="18"
          height="20"
          viewBox="0 0 814 1000"
          xmlns="http://www.w3.org/2000/svg"
          fill="currentColor"
        >
          <path
            d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-42.4-150.3-109.2C74 372.1 0 266.7 0 166.3C0 76.3 55.9 28.6 108.2 28.6c72.9 0 132.4 51.2 166.4 51.2 32.5 0 101.5-54.4 186.8-54.4 29.6 0 108.2 11.5 177.8 87.3zM467.2 24.5C462 60 440.3 95.8 406.3 116.9c-31.3 19-65.8 23.9-90.7 23.9-.5-3.2-.9-6.5-.9-9.7 0-37.9 21.1-74.4 53-96.3C403.5 14.6 446.2 3.9 467.2 0c.5 8.3.9 16.5 0 24.5z"
          />
        </svg>
        <span>APPLE</span>
      </button>
    </div>
  </div>

  <!-- ── Bottom Ayat ──────────────────────────────────────────────────────── -->
  <div class="ayat-section">
    <div class="ayat-diamond">◆</div>
    <p class="ayat-arabic">
      كِتَٰبٌ أَنزَلۡنَٰهُ إِلَيۡكَ مُبَٰرَكٌ لِّيَدَّبَّرُوٓاْ ءَايَٰتِهِۦ
    </p>
    <p class="ayat-translation">
      A blessed Book which We have revealed to you<br />that they might reflect
      upon its verses.
    </p>
    <p class="ayat-ref">SURAH SAD (38:29)</p>
  </div>

  <div style="height: 40px"></div>
</ion-content>
