<app-card tone="primary" elevation="raised">
  <article class="reading">
    <div class="reading__eyebrow">
      <span>Continue reading</span>
      <span>Juz {{ reading.juz }}</span>
    </div>

    <h2>{{ reading.surahName }}</h2>
    <p>Last read · Ayah {{ reading.lastAyah }}</p>

    <div
      class="progress"
      role="progressbar"
      aria-label="Reading progress"
      aria-valuemin="0"
      aria-valuemax="100"
      [attr.aria-valuenow]="reading.progress"
    >
      <span [style.width.%]="reading.progress"></span>
    </div>

    <div class="reading__footer">
      <span>{{ reading.progress }}% complete</span>
      <app-button
        variant="secondary"
        size="compact"
        (click)="continueReading()"
      >
        Continue reading
      </app-button>
    </div>
  </article>
</app-card>
