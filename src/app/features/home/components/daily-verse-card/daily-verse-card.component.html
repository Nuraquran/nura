<section aria-label="Daily verse">
  <app-section-header title="Verse of the day" />
  <blockquote>
    <p class="arabic" lang="ar" dir="rtl">{{ verse.arabic }}</p>
    <p class="translation">“{{ verse.translation }}”</p>
    <footer>
      <cite>{{ verse.surahName }} · {{ verse.ayahNumber }}</cite>
    </footer>
  </blockquote>
</section>
