<section aria-label="Recently opened surahs">
  <app-section-header
    title="Recently opened"
    description="Continue where you left off"
  />

  <ol class="surahs">
    @for (surah of surahs; track surah.number) {
      <li>
        <a
          [routerLink]="['/quran', surah.number]"
          [attr.aria-label]="'Open Surah ' + surah.name"
        >
          <span class="surah__number" aria-hidden="true">
            {{ surah.number }}
          </span>
          <span class="surah__body">
            <span class="surah__names">
              <strong>{{ surah.name }}</strong>
              <span class="surah__arabic" lang="ar" dir="rtl">
                {{ surah.arabicName }}
              </span>
            </span>
            <span class="surah__meta">
              {{ surah.totalAyahs }} ayahs · Last read {{ surah.lastAyah }}
            </span>
          </span>
          <span class="surah__progress" aria-hidden="true">
            {{ surah.progress }}%
          </span>
        </a>
      </li>
    }
  </ol>
</section>
