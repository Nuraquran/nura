<ion-header class="reader-header ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button routerLink="/quran" aria-label="Back to Surah list">
        <ion-icon slot="icon-only" name="arrow-back-outline" aria-hidden="true" />
      </ion-button>
    </ion-buttons>

    <ion-title>{{ surah.name }}</ion-title>

  </ion-toolbar>
</ion-header>

<ion-content>
  <main class="reader-content">
    <section class="surah-info" aria-labelledby="surah-title">
      <h1 id="surah-title" class="surah-info__arabic" lang="ar" dir="rtl">
        {{ surah.arabicName }}
      </h1>
      <p>
        Surah {{ surah.number }} · {{ surah.totalAyahs }} ayahs ·
        {{ surah.revelationPlace }}
      </p>
    </section>

    <app-ayah-list
      [ayahs]="surah.ayahs"
      [preferences]="preferences()"
      [selectedAyahId]="selectedAyah()?.id ?? null"
      [bookmarkedAyahNumbers]="bookmarkedAyahNumbers()"
      [engagedAudioAyahNumber]="engagedAudioAyahNumber()"
      (selectedAyahChange)="selectedAyah.set($event)"
      (actionRequested)="handleAyahAction($event)"
    />
  </main>
</ion-content>

<ion-footer class="reader-footer ion-no-border">
  @if (audio.active()) {
    <app-audio-mini-player
      [state]="audio.state()"
      [reciterName]="audio.currentReciter().name"
      [hasPrevious]="hasPreviousAudioAyah()"
      [hasNext]="hasNextAudioAyah()"
      (playPause)="toggleCurrentAudio()"
      (previous)="playPreviousAyah()"
      (next)="playNextAyah()"
      (settings)="audioSettingsOpen.set(true)"
    />
  }

  <ion-toolbar>
    <nav class="reading-toolbar" aria-label="Reading controls">
      <button
        type="button"
        [attr.aria-label]="
          audioControlEngaged()
            ? 'Pause audio'
            : 'Play audio'
        "
        [attr.aria-pressed]="audioControlEngaged()"
        (click)="toggleAudio()"
      >
        <ion-icon
          [name]="
            audioControlEngaged()
              ? 'pause-outline'
              : 'play-outline'
          "
          aria-hidden="true"
        />
        <span>
          {{
            audioControlEngaged() ? 'Pause' : 'Play'
          }}
        </span>
      </button>

      <button
        type="button"
        [attr.aria-label]="
          selectedAyah()
            ? selectedAyahBookmarked()
              ? 'Remove selected ayah bookmark'
              : 'Bookmark selected ayah'
            : 'Select an ayah to bookmark'
        "
        [attr.aria-pressed]="selectedAyahBookmarked()"
        (click)="toggleSelectedAyahBookmark()"
      >
        <ion-icon
          [name]="selectedAyahBookmarked() ? 'bookmark' : 'bookmark-outline'"
          aria-hidden="true"
        />
        <span>Bookmark Ayah</span>
      </button>

      <button
        type="button"
        [attr.aria-label]="selectedAyah() ? 'Share selected ayah' : 'Share surah'"
        (click)="shareReading()"
      >
        <ion-icon name="share-social-outline" aria-hidden="true" />
        <span>Share</span>
      </button>

      <button
        type="button"
        aria-label="Open reading settings"
        (click)="settingsOpen.set(true)"
      >
        <ion-icon name="options-outline" aria-hidden="true" />
        <span>Settings</span>
      </button>
    </nav>
  </ion-toolbar>
</ion-footer>

<app-reading-settings
  [open]="settingsOpen()"
  [preferences]="preferences()"
  (openChange)="settingsOpen.set($event)"
  (preferencesChange)="updatePreferences($event)"
/>

<app-reciter-settings
  [open]="audioSettingsOpen()"
  [selectedReciterId]="audio.state().reciterId"
  (openChange)="audioSettingsOpen.set($event)"
  (reciterChange)="audio.setReciter($event)"
/>

<ion-toast
  [isOpen]="toastOpen()"
  [message]="toastMessage()"
  [duration]="2400"
  position="bottom"
  (didDismiss)="toastOpen.set(false)"
/>
