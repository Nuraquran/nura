<section class="ayah-list" aria-label="Ayahs">
  @for (ayah of ayahs; track trackByAyahId($index, ayah)) {
    <article
      [attr.id]="'ayah-' + ayah.number"
      class="ayah"
      [class.ayah--selected]="selectedAyahId === ayah.id"
      [class.ayah--bookmarked]="isBookmarked(ayah.number)"
    >
      <div
        class="ayah__selectable"
        role="button"
        tabindex="0"
        [attr.aria-pressed]="selectedAyahId === ayah.id"
        [attr.aria-label]="'Select ayah ' + ayah.number"
        (click)="toggleSelection(ayah)"
        (keydown)="handleSelectionKey($event, ayah)"
      >
        <span class="ayah__number" aria-hidden="true">{{ ayah.number }}</span>
        <p
          class="ayah__arabic"
          lang="ar"
          dir="rtl"
          [class.ayah__arabic--small]="
            preferences.arabicFontSize === 'small'
          "
          [class.ayah__arabic--large]="
            preferences.arabicFontSize === 'large'
          "
        >
          {{ ayah.arabic }}
        </p>

        @if (preferences.showTranslation) {
          <p
            class="ayah__translation"
            [class.ayah__translation--small]="
              preferences.translationFontSize === 'small'
            "
            [class.ayah__translation--large]="
              preferences.translationFontSize === 'large'
            "
          >
            {{ ayah.translation }}
          </p>
        }
      </div>

      @if (selectedAyahId === ayah.id) {
        <div class="ayah__actions" aria-label="Selected ayah actions">
          <button
            type="button"
            (click)="requestAction('play', ayah)"
          >
            Audio preview
          </button>
          <button
            type="button"
            (click)="requestAction('bookmark', ayah)"
          >
            {{ isBookmarked(ayah.number) ? 'Remove bookmark' : 'Bookmark' }}
          </button>
          <button
            type="button"
            (click)="requestAction('share', ayah)"
          >
            Share
          </button>
        </div>
      }
    </article>
  }

</section>
